[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ld6002c-fall-detection"
version = "0.1.0"
description = "Teaching project for HLK-LD6002C millimeter-wave fall detection with mock and serial modes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LD6002C Fall Detection Course" }
]
dependencies = [
  "pyserial>=3.5",
  "pandas>=2.0",
  "altair>=5.0",
  "streamlit>=1.59,<2",
  "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
firmware = [
  "platformio>=6.1,<7"
]

[project.scripts]
ld6002c-fall = "ld6002c_fall.main:main"
ld6002c-community-demo = "ld6002c_fall.community_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
